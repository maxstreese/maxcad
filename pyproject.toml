[project]
name = "maxcad"
version = "0.1.0"
description = "Personal CAD and 3D printing models"
requires-python = ">=3.13,<3.14"
dependencies = [
    "build123d>=0.13.0",
    "yacv-server>=0.12.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cadkit"
