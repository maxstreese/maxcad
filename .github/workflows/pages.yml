# Publishes the site to GitHub Pages: `just site` in the flake's dev shell
# builds every project and generates site/, which is uploaded and deployed as
# it is. Nothing generated is committed.
#
# Needs Pages switched on once, with "GitHub Actions" as its source
# (Settings > Pages); until then the deploy job fails.
#
# Runs beside checks.yml on a push to main, not after it: `just ci` builds
# the same site, so a main that fails its checks has usually failed here too.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and one that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in checks.yml.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: nix develop --command just site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
