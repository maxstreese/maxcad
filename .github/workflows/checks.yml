# What CI runs, which is `just ci` in the flake's dev shell: the Renovate
# configs and workflows lint, uv.lock installs exactly, the vendored agent
# skills match their release, every part of every project builds and
# exports, and the site generates from that (pages.yml publishes it).
#
# Everything the repo knows about checking itself lives in the justfile and
# the flake; this file only gets a machine into a state where that command
# can run. If a second check seems to belong here, it probably belongs in
# `just ci` instead.
#
# What this cannot cover: whether a part still fits. Renovate merges its PRs
# once this is green all the same (renovate.jsonc: automerge).
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinning the action's SHA pins the installer script, not the Nix it
      # installs; install_url does that, the same Nix as maxi-me's CI.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: nix develop --command just ci
